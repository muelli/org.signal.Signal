name: Build bundle
on:
  push:
    branches: [retain-deleted-messages]
  workflow_dispatch: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: fedora:latest
      options: --privileged

    steps:
      - name: Install flatpak and flatpak-builder
        run: dnf install -y flatpak flatpak-builder git

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      # Root makes tar restore archive ownership, which fails inside the build sandbox.
      - name: Create an unprivileged build user
        run: useradd -m builder && chown -R builder .

      - name: Add Flathub
        run: su builder -c 'flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo'

      - name: Build
        run: su builder -c 'timeout -k 30s 330m flatpak-builder --user --disable-rofiles-fuse --install-deps-from=flathub --force-clean --repo=repo build org.signal.Signal.yaml'

      - name: Export the bundle
        run: su builder -c 'flatpak build-bundle repo org.signal.Signal.flatpak org.signal.Signal'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: org.signal.Signal.flatpak
          path: org.signal.Signal.flatpak
          compression-level: 0
